<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chemistry Hub</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="hero">
  <h1>🧪 Chemistry Learning Hub</h1>
  <p>Learn chemistry with quizzes + AI assistant</p>
</header>

<main>

  <!-- FACTS -->
  <section class="card">
    <h2>🔬 Chemistry Fact</h2>
    <p id="factBox"></p>
    <button onclick="showFact()">New Fact</button>
  </section>

  <!-- QUIZ -->
  <section class="card">
    <h2>🧠 Quiz</h2>

    <p id="question"></p>

    <div id="options" class="options">
      <button onclick="checkAnswer(0)"></button>
      <button onclick="checkAnswer(1)"></button>
      <button onclick="checkAnswer(2)"></button>
      <button onclick="checkAnswer(3)"></button>
    </div>

    <p id="quizResult"></p>
  </section>

  <!-- CHATBOT -->
  <section class="card chat-card">
    <h2>🤖 Chemistry Chatbot</h2>

    <div id="chatBox"></div>

    <div class="chat-input">
      <input id="userInput" placeholder="Ask chemistry..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </section>

  <!-- CREDITS -->
  <section class="card">
    <h2>👨‍💻 Credits</h2>

    <div class="name">⭐ Aarush Balamurugan ⭐</div>

    <ul>
      <li>Abhijith Bandu</li>
      <li>Heet Patel</li>
      <li>Shriyans Samantha Goud</li>
      <li>Avyaan Patel</li>
      <li>Jimmy</li>
    </ul>
  </section>

</main>

<script src="script.js"></script>

</body>
</html>
